<script>
(() => {
const __logic_js = (() => {
// Pure planning logic: no DOM, no db. Inputs are never mutated.

const UNASSIGNED = "ยังไม่ระบุครู";
const COURSE_TYPES = ["พื้นฐาน", "เพิ่มเติม", "เข้มข้น"];

function topicName(topicsById, id) {
  if (topicsById[id]) return topicsById[id].name;
  // Topics typed by hand in the sheet that aren't in the topic list keep their own name.
  return id?.startsWith("name:") ? id.slice(5) : "(ไม่พบเรื่อง)";
}

const th = (a, b) => a.localeCompare(b, "th");

function groupByTeacher(classes) {
  const groups = new Map();
  for (const c of classes) {
    const key = c.teacher.trim() || UNASSIGNED;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  return [...groups.entries()]
    .sort(([a], [b]) => (a === UNASSIGNED ? -1 : b === UNASSIGNED ? 1 : th(a, b)))
    .map(([teacher, list]) => ({
      teacher,
      classes: [...list].sort((x, y) => th(x.school, y.school) || th(x.room, y.room)),
    }));
}

function filterClasses(classes, filter) {
  if (filter === "review") return classes.filter((c) => c.needsReview);
  if (COURSE_TYPES.includes(filter)) return classes.filter((c) => c.courseType === filter);
  return [...classes];
}

function term1Rows(sequence, end) {
  const at = sequence.indexOf(end.topicId);
  return sequence.map((topicId, i) => ({
    topicId,
    state: at < 0 || i > at ? "untaught" : i < at ? "done" : end.status === "partial" ? "partial" : "end",
  }));
}

function pickerGroups(cls, sequences, topics, query) {
  const seq = sequences[cls.courseType] ?? { 1: [], 2: [] };
  const byId = Object.fromEntries(topics.map((t) => [t.id, t]));
  const leftover = term1Rows(seq["1"] ?? [], cls.term1End)
    .filter((r) => r.state === "partial" || r.state === "untaught")
    .map((r) => r.topicId);
  const used = new Set();
  const take = (ids) => ids.filter((id) => byId[id] && !used.has(id) && used.add(id));
  const groups = [
    { key: "leftover", title: "เทอม 1 ที่ยังไม่ได้สอน", ids: take(leftover) },
    { key: "standard", title: `เทอม 2 มาตรฐาน (${cls.courseType})`, ids: take(seq["2"] ?? []) },
    { key: "other", title: "เรื่องอื่นทั้งหมด", ids: take(topics.map((t) => t.id)) },
  ];
  const q = query.trim();
  const selected = new Set(cls.term2TopicIds);
  return groups
    .map(({ key, title, ids }) => ({
      key,
      title,
      items: ids
        .filter((id) => !q || byId[id].name.includes(q))
        .map((id) => ({ id, name: byId[id].name, selected: selected.has(id) })),
    }))
    .filter((g) => g.items.length > 0);
}

function addTopic(list, id) {
  return list.includes(id) ? [...list] : [...list, id];
}

function moveTopic(list, index, delta) {
  const to = index + delta;
  const out = [...list];
  if (index < 0 || index >= list.length || to < 0 || to >= list.length) return out;
  [out[index], out[to]] = [out[to], out[index]];
  return out;
}

function removeTopicAt(list, index) {
  return list.filter((_, i) => i !== index);
}

function slugifyTopic(name, existingIds) {
  const base = "t-" + Date.now().toString(36);
  let id = base;
  for (let n = 2; existingIds.has(id); n++) id = `${base}-${n}`;
  return id;
}

// Fill missing or mistyped fields so one malformed document can't break rendering.
function normalizeClass(raw) {
  const str = (v) => (typeof v === "string" ? v : "");
  const end = raw.term1End && typeof raw.term1End === "object" ? raw.term1End : {};
  return {
    id: str(raw.id),
    teacher: str(raw.teacher),
    school: str(raw.school),
    room: str(raw.room),
    grade: str(raw.grade) || "ม.1",
    courseType: COURSE_TYPES.includes(raw.courseType) ? raw.courseType : "เพิ่มเติม",
    term1End: { topicId: str(end.topicId), status: end.status === "partial" ? "partial" : "done", note: str(end.note) },
    term2TopicIds: Array.isArray(raw.term2TopicIds) ? raw.term2TopicIds.filter((x) => typeof x === "string") : [],
    needsReview: raw.needsReview === true,
    updatedAt: typeof raw.updatedAt === "number" ? raw.updatedAt : 0,
  };
}

return { UNASSIGNED, COURSE_TYPES, topicName, groupByTeacher, filterClasses, term1Rows, pickerGroups, addTopic, moveTopic, removeTopicAt, slugifyTopic, normalizeClass };
})();

const __sheet_format_js = (() => {
// Pure mapping between Google Sheets rows and app records. Sheets hold topic NAMES so people can
// read and edit them directly; names the topic list doesn't know become "name:<text>" ids.
const { normalizeClass } = __logic_js;

const MAX_TERM2 = 20;
const CLASS_HEADER = [
  "รหัส", "ครู", "โรงเรียน", "ห้อง", "ประเภท", "จบเทอม 1", "สถานะ", "หมายเหตุ", "ต้องตรวจ", "แก้ล่าสุด",
  ...Array.from({ length: MAX_TERM2 }, (_, i) => `เทอม 2 เรื่องที่ ${i + 1}`),
];
const TOPIC_HEADER = ["รหัส", "ชื่อเรื่อง", "รายละเอียด (บรรทัดละข้อ)"];
const SEQUENCE_HEADER = ["ประเภท", "เทอม", "เรื่อง (เรียงตามลำดับ)"];

const cell = (v) => (v === undefined || v === null ? "" : String(v).trim());
const name = (topicsById, id) => topicsById[id]?.name ?? (id.startsWith("name:") ? id.slice(5) : id);

function nameIndex(topics) {
  return new Map(topics.map((t) => [t.name.trim(), t.id]));
}

const idFor = (idx, text) => (text ? idx.get(text) ?? "name:" + text : "");

function classToRow(cls, topicsById, now) {
  const t2 = cls.term2TopicIds.slice(0, MAX_TERM2).map((id) => name(topicsById, id));
  return [
    cls.id, cls.teacher, cls.school, cls.room, cls.courseType,
    cls.term1End.topicId ? name(topicsById, cls.term1End.topicId) : "",
    cls.term1End.status === "partial" ? "ยังไม่จบ" : "จบแล้ว",
    cls.term1End.note, cls.needsReview,
    new Date(now).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Bangkok" }),
    ...t2, ...Array(MAX_TERM2 - t2.length).fill(""),
  ];
}

function rowToClass(row, idx) {
  const r = (i) => cell(row[i]);
  const review = row[8];
  return normalizeClass({
    id: r(0), teacher: r(1), school: r(2), room: r(3), courseType: r(4),
    term1End: { topicId: idFor(idx, r(5)), status: r(6) === "ยังไม่จบ" ? "partial" : "done", note: r(7) },
    needsReview: review === true || ["TRUE", "ใช่"].includes(cell(review).toUpperCase()),
    term2TopicIds: row.slice(10, 10 + MAX_TERM2).map(cell).filter(Boolean).map((t) => idFor(idx, t)),
  });
}

function rowsToClasses(rows, topics) {
  const idx = nameIndex(topics);
  return rows.filter((row) => cell(row?.[0])).map((row) => rowToClass(row, idx));
}

function topicToRow(t) {
  return [t.id, t.name, t.details.join("\n")];
}

function rowsToTopics(rows) {
  return rows
    .filter((row) => cell(row?.[1]))
    .map((row) => ({
      id: cell(row[0]) || "name:" + cell(row[1]),
      name: cell(row[1]),
      details: cell(row[2]).split("\n").map((s) => s.trim()).filter(Boolean),
    }));
}

function sequencesToRows(sequences, topicsById) {
  return Object.entries(sequences).flatMap(([type, terms]) =>
    ["1", "2"].filter((t) => terms[t]).map((t) => [type, Number(t), ...terms[t].map((id) => name(topicsById, id))]),
  );
}

function rowsToSequences(rows, topics) {
  const idx = nameIndex(topics);
  const out = {};
  for (const row of rows) {
    const type = cell(row?.[0]);
    const term = cell(row?.[1]);
    if (!type || !["1", "2"].includes(term)) continue;
    out[type] ??= {};
    out[type][term] = row.slice(2).map(cell).filter(Boolean).map((t) => idFor(idx, t));
  }
  return out;
}

return { MAX_TERM2, CLASS_HEADER, TOPIC_HEADER, SEQUENCE_HEADER, nameIndex, classToRow, rowToClass, rowsToClasses, topicToRow, rowsToTopics, sequencesToRows, rowsToSequences };
})();

const __summary_js = (() => {
// Summary table and PNG export, shared by the planner (app.js) and the teachers' read-only viewer.
const L = __logic_js;

const EXPORT_TITLE = "เนื้อหาคณิตศาสตร์เทอม 2 ปีการศึกษา 2569";

const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function summaryTableHtml(classes, topicsById) {
  const rows = L.groupByTeacher(classes)
    .flatMap((g) =>
      g.classes.map((c, i) => {
        const end = L.topicName(topicsById, c.term1End.topicId);
        const topics = c.term2TopicIds.map((id, k) => `<span><b>${k + 1}.</b>${esc(L.topicName(topicsById, id))}</span>`).join("");
        return `<tr class="${i === 0 ? "first" : ""}">
          <td class="teacher">${i === 0 ? esc(g.teacher) : ""}</td>
          <td>${esc(c.school)} · ${esc(c.room)}</td><td>${esc(c.courseType)}</td>
          <td>${esc(end)}${c.term1End.status === "partial" ? ` <span class="nowrap">(ยังไม่จบ)</span>` : ""}${c.term1End.note ? `<div class="muted small">${esc(c.term1End.note)}</div>` : ""}</td>
          <td><div class="topics">${topics || `<span class="muted">ยังไม่ได้เลือก</span>`}</div></td></tr>`;
      }),
    )
    .join("");
  return `<div class="table-wrap"><table class="sum">
    <thead><tr><th>ครู</th><th>โรงเรียน · ห้อง</th><th>ประเภท</th><th>จบเทอม 1</th><th>เนื้อหาเทอม 2</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

async function exportPng(classes, topicsById) {
  const root = document.createElement("div");
  root.id = "export-root";
  root.innerHTML = `<div class="export-head"><h1>${EXPORT_TITLE}</h1><span>ข้อมูล ณ ${new Date().toLocaleDateString("th-TH", { dateStyle: "long" })}</span></div>${summaryTableHtml(classes, topicsById)}`;
  document.body.appendChild(root);
  try {
    // Wait only after the export surface is in the document, so faces it alone uses are loaded too.
    await document.fonts.ready;
    const canvas = await window.html2canvas(root, { scale: 2, backgroundColor: "#FFFFFF", logging: false });
    return await new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("toBlob"))), "image/png"));
  } finally {
    root.remove();
  }
}

return { EXPORT_TITLE, esc, summaryTableHtml, exportPng };
})();

const __viewer_app_js = (() => {
// Read-only page for teachers, served by the sheet's Apps Script web app (apps-script/Code.gs).
// Bundled into viewer/index.html by tools/build-viewer.mjs; data comes from google.script.run.getData().
const L = __logic_js;
const F = __sheet_format_js;
const { esc, summaryTableHtml, exportPng } = __summary_js;

const POLL_MS = 30000;
const state = {
  status: "loading", // loading | ready | error
  stale: false,
  updatedAt: null,
  classes: [],
  topics: [],
  view: "list",
  filter: "all",
  exporting: false,
  preview: null, // {url}
  notice: "",
};
const app = document.getElementById("app");
const topicsById = () => Object.fromEntries(state.topics.map((t) => [t.id, t]));
const FILTERS = [["all", "ทั้งหมด"], ...L.COURSE_TYPES.map((t) => [t, t])];
const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const ICON_REFRESH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>`;

function load() {
  google.script.run.withSuccessHandler(apply).withFailureHandler(failed).getData();
}

function apply(data) {
  const topics = F.rowsToTopics(data.topics || []);
  state.topics = topics;
  state.classes = F.rowsToClasses(data.classes || [], topics);
  state.status = "ready";
  state.stale = false;
  state.updatedAt = new Date();
  render();
}

function failed(e) {
  console.error("getData", e);
  if (state.status === "ready") state.stale = true;
  else state.status = "error";
  render();
}

function header() {
  const tab = (key, label) =>
    `<button class="tab" role="tab" data-action="view" data-view="${key}" aria-selected="${state.view === key}">${label}</button>`;
  const when = state.updatedAt ? ` · อัปเดต ${state.updatedAt.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })}` : "";
  return `<header class="top">
    <div><h1>เนื้อหาคณิตศาสตร์เทอม 2</h1><p class="muted small">ปีการศึกษา 2569 · ม.1 · ดูอย่างเดียว${when}</p></div>
    <div class="top-actions">${state.status === "ready" ? `<button class="btn" data-action="refresh">${ICON_REFRESH}รีเฟรช</button>` : ""}
    <div class="tabs" role="tablist">${tab("list", "ห้องเรียน")}${tab("summary", "สรุป")}</div></div>
  </header>`;
}

function listView() {
  const byId = topicsById();
  const chips = FILTERS.map(
    ([key, label]) => `<button class="chip" data-action="filter" data-filter="${esc(key)}" aria-pressed="${state.filter === key}">${label}</button>`,
  ).join("");
  const groups = L.groupByTeacher(L.filterClasses(state.classes, state.filter))
    .map(
      (g) => `<section class="group"><div class="group-head"><h2>${esc(g.teacher)}</h2><span class="muted small">${g.classes.length} ห้อง</span></div>
      <div class="rows">${g.classes
        .map((c) => {
          const end = esc(L.topicName(byId, c.term1End.topicId)) + (c.term1End.status === "partial" ? ` <span class="pill">ยังไม่จบ</span>` : "");
          const t2 = c.term2TopicIds.map((id, k) => `<span><b>${k + 1}.</b>${esc(L.topicName(byId, id))}</span>`).join("");
          return `<div class="row view-row" data-class-id="${esc(c.id)}">
            <span class="where">${esc(c.school)} · ${esc(c.room)} <span class="muted small">· ${esc(c.courseType)}</span></span>
            <span class="meta"><span>จบเทอม 1: ${end}</span>${c.term1End.note ? `<span>${esc(c.term1End.note)}</span>` : ""}</span>
            <div class="t2"><span class="label">เทอม 2</span><div class="topics">${t2 || `<span class="muted">ยังไม่ได้กำหนด</span>`}</div></div>
          </div>`;
        })
        .join("")}</div></section>`,
    )
    .join("");
  return `<div class="chips" role="group" aria-label="กรองห้อง">${chips}</div>${groups || `<p class="empty">ไม่มีห้องที่ตรงกับตัวกรองนี้</p>`}`;
}

function summaryView() {
  return `<div class="toolbar"><p class="muted small" style="margin:0">${state.classes.length} ห้อง</p>
      <button class="btn primary" data-action="export" ${state.exporting ? "disabled" : ""}>${state.exporting ? "กำลังสร้างภาพ…" : "บันทึกเป็น PNG"}</button></div>
    ${state.notice ? `<div class="alert" role="status"><span>${esc(state.notice)}</span></div>` : ""}
    ${summaryTableHtml(state.classes, topicsById())}`;
}

function previewView() {
  if (!state.preview) return "";
  return `<div class="dialog-backdrop" data-action="close-preview"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="sheet-head" style="margin:0"><h2 id="preview-title">ภาพสรุปเทอม 2</h2>
      <button class="btn icon-btn" data-action="close-preview" aria-label="ปิดภาพ">${ICON_X}</button></div>
    <p class="muted small" style="margin:0">แตะค้างที่ภาพ (หรือคลิกขวา) เพื่อบันทึกภาพ</p>
    <div class="dialog-body"><img class="preview-img" src="${state.preview.url}" alt="ตารางสรุปเนื้อหาเทอม 2 รายครู"></div>
  </div>`;
}

function body() {
  if (state.status === "loading") return `<p class="muted">กำลังโหลดข้อมูล…</p>`;
  if (state.status === "error")
    return `<div class="notice"><h2>โหลดข้อมูลไม่ได้</h2><p class="muted">ตรวจสัญญาณอินเทอร์เน็ต แล้วลองใหม่อีกครั้ง</p>
      <div class="toolbar" style="justify-content:flex-start"><button class="btn" data-action="retry">ลองใหม่</button></div></div>`;
  const stale = state.stale ? `<div class="alert" role="status"><span>อัปเดตข้อมูลไม่ได้ชั่วคราว ข้อมูลที่เห็นอาจไม่ใช่ล่าสุด</span></div>` : "";
  return stale + (state.view === "summary" ? summaryView() : listView());
}

function render() {
  app.innerHTML = header() + body() + previewView();
}

async function startExport() {
  state.exporting = true;
  state.notice = "";
  render();
  try {
    if (typeof window.html2canvas !== "function") throw new Error("html2canvas not loaded");
    const blob = await exportPng(state.classes, topicsById());
    state.preview = { url: URL.createObjectURL(blob) };
  } catch (e) {
    console.error("export", e);
    state.notice = "สร้างภาพไม่สำเร็จ ลองโหลดหน้านี้ใหม่แล้วกดอีกครั้ง";
  } finally {
    state.exporting = false;
    render();
  }
}

function closePreview() {
  if (state.preview) URL.revokeObjectURL(state.preview.url);
  state.preview = null;
  render();
}

app.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "view") { state.view = el.dataset.view; render(); }
  else if (a === "filter") { state.filter = el.dataset.filter; render(); }
  else if (a === "refresh") load();
  else if (a === "retry") { state.status = "loading"; render(); load(); }
  else if (a === "export") startExport();
  else if (a === "close-preview") closePreview();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && state.preview) closePreview(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.status === "ready") load(); });
setInterval(() => { if (!document.hidden) load(); }, POLL_MS);

render();
load();

return {  };
})();
})();
</script>
</body>
</html>
