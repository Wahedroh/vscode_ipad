<title>Term 2 Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column of teacher groups; editor slides in as a full sheet on phones, a right panel on iPad. */
:root {
  --bg: #FAFAF9; --card: #FFFFFF; --fg: #1C1917; --muted: #57534E; --line: #E7E5E4;
  --accent: #0F766E; --on-accent: #FFFFFF; --warn: #C2410C; --danger: #B91C1C;
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
  --warn-soft: color-mix(in srgb, var(--warn) 12%, transparent);
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --radius: 10px; --tap: 44px; --ease: 160ms ease;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1917; --card: #292524; --fg: #F5F5F4; --muted: #A8A29E; --line: #44403C;
    --accent: #5EEAD4; --on-accent: #042F2E; --warn: #FB923C; --danger: #F87171; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1917; --card: #292524; --fg: #F5F5F4; --muted: #A8A29E; --line: #44403C;
  --accent: #5EEAD4; --on-accent: #042F2E; --warn: #FB923C; --danger: #F87171; color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --ease: 0ms linear; } }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: var(--s4) var(--s6);
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: var(--s5); }
h1, h2, h3 { margin: 0; line-height: 1.35; text-wrap: balance; font-weight: 600; }
h1 { font-size: 1.375rem; }
h2 { font-size: 1rem; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header + tabs */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--s3); }
.top p { margin: 0; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; background: var(--card); }
.tab { min-height: 38px; padding: 0 var(--s4); border: 0; border-radius: 7px; background: transparent; color: var(--muted); transition: background var(--ease), color var(--ease); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 500; }

/* Buttons + chips */
.btn { min-height: var(--tap); padding: 0 var(--s4); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); display: inline-flex; align-items: center; gap: var(--s2); transition: border-color var(--ease), background var(--ease); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 500; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: var(--tap); height: var(--tap); padding: 0; justify-content: center; flex: none; }
.icon-btn svg, .btn svg { width: 18px; height: 18px; flex: none; }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s2); }
.chip { min-height: 36px; padding: 0 var(--s3); border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: .875rem; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: .8125rem; font-weight: 500; color: var(--warn); white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill { font-size: .8125rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 var(--s2); white-space: nowrap; }

/* Notices */
.notice { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s4); background: var(--card); display: grid; gap: var(--s2); }
.alert { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: var(--radius); padding: var(--s2) var(--s3); display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; justify-content: space-between; }

/* Class list */
.group { display: grid; gap: var(--s2); }
.group-head { display: flex; align-items: baseline; gap: var(--s2); padding-inline: var(--s1); }
.rows { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.row { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; padding: var(--s3) var(--s4); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s1) var(--s3); align-items: center; min-height: 60px; transition: background var(--ease); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row .where { font-weight: 500; min-width: 0; }
.row .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); font-size: .875rem; color: var(--muted); }

/* Editor sheet */
.sheet-backdrop { position: fixed; inset: 0; background: color-mix(in srgb, var(--fg) 35%, transparent); z-index: 20; }
.sheet { position: fixed; inset: 0; z-index: 21; background: var(--bg); overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(var(--s6) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 768px) {
  .sheet { left: auto; width: 420px; border-left: 1px solid var(--line); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); }
.section { display: grid; gap: var(--s3); padding-block: var(--s4); border-top: 1px solid var(--line); }
.section p { margin: 0; }
.section:first-of-type { border-top: 0; padding-top: 0; }
.field { display: grid; gap: var(--s1); }
.field label, .label { font-size: .8125rem; font-weight: 500; color: var(--muted); letter-spacing: .01em; }
.input { min-height: var(--tap); width: 100%; padding: 0 var(--s3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.switch { display: flex; align-items: center; gap: var(--s2); min-height: var(--tap); }
.switch input { width: 20px; height: 20px; accent-color: var(--warn); }
.seg { justify-self: start; display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { min-height: 40px; padding: 0 var(--s4); border: 0; background: var(--card); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.steps { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.steps li + li { border-top: 1px solid var(--line); }
.step { width: 100%; min-height: var(--tap); display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border: 0; background: transparent; text-align: left; }
.step .mark { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); color: var(--muted); }
.step .mark svg { width: 14px; height: 14px; }
.step[data-state="done"] { color: var(--muted); }
.step[data-state="end"] .mark, .step[data-state="partial"] .mark { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.step[data-state="partial"] .mark { background: linear-gradient(90deg, var(--accent) 50%, var(--card) 50%); }
.step .state { margin-left: auto; font-size: .8125rem; color: var(--muted); }
.order { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.order li { display: flex; align-items: center; gap: var(--s1); padding: var(--s1) var(--s1) var(--s1) var(--s3); min-height: 52px; }
.order li + li { border-top: 1px solid var(--line); }
.order .n { font-variant-numeric: tabular-nums; color: var(--muted); width: 1.75rem; flex: none; }
.order .name { flex: 1; min-width: 0; }
.order .icon-btn { border-color: transparent; background: transparent; }
.empty { padding: var(--s4); color: var(--muted); text-align: center; }

/* Dialogs (picker, confirm, preview) */
.dialog { position: fixed; z-index: 31; inset: auto 0 0 0; max-height: 88%; display: flex; flex-direction: column; background: var(--bg); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: var(--s4) max(16px, env(safe-area-inset-right, 0px)) calc(var(--s4) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: var(--s3); }
@media (min-width: 768px) {
  .dialog { inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 48px)); border: 1px solid var(--line); border-radius: 16px; max-height: 80%; }
}
.dialog-backdrop { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--fg) 40%, transparent); }
.dialog-body { overflow-y: auto; min-height: 0; display: grid; gap: var(--s4); overscroll-behavior: contain; }
.pick-group { display: grid; gap: var(--s2); }
.pick { width: 100%; text-align: left; min-height: var(--tap); padding: var(--s2) var(--s3); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); display: grid; gap: 2px; }
.pick:disabled { opacity: .45; cursor: default; }
.pick .d { font-size: .8125rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.preview-img { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #FFFFFF; -webkit-touch-callout: default; }

/* Summary table */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.sum { border-collapse: collapse; width: 100%; min-width: 720px; font-size: .9375rem; }
.sum th, .sum td { text-align: left; vertical-align: top; padding: var(--s2) var(--s3); border-top: 1px solid var(--line); }
.sum thead th { border-top: 0; font-size: .8125rem; font-weight: 500; color: var(--muted); white-space: nowrap; }
.sum tr.first td { border-top: 2px solid var(--fg); }
.sum tbody tr:first-child td { border-top: 0; }
.sum .teacher { font-weight: 600; white-space: nowrap; }
.sum td:nth-child(3), .sum .nowrap { white-space: nowrap; }
.sum .topics { display: flex; flex-wrap: wrap; gap: 2px var(--s3); }
.sum .topics span { white-space: nowrap; }
.sum .topics b { font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }

/* PNG export surface: always light, fixed width */
#export-root { position: fixed; left: -10000px; top: 0; width: 1600px; padding: 48px; background: #FFFFFF; color: #1C1917; font: 20px/1.6 var(--font);
  --bg: #FFFFFF; --card: #FFFFFF; --fg: #1C1917; --muted: #57534E; --line: #E7E5E4; --accent: #0F766E; }
#export-root .table-wrap { overflow: visible; border-radius: 0; }
#export-root .sum { min-width: 0; font-size: 20px; }
#export-root .sum th, #export-root .sum td { padding: 12px 16px; }
#export-root .sum thead th { font-size: 17px; }
#export-root .small { font-size: 16px; }
.export-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 24px; }
.export-head h1 { font-size: 34px; }
</style>

<main class="wrap" id="app" aria-live="polite"></main>
<script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script type="module" src="app.js"></script>
